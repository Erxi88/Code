[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kanzlei-recherche"
version = "0.1.0"
description = "Recherche von Steuerberaterkanzleien je Bundesland: Websuche, Crawling, Extraktion, Excel-Export"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "trafilatura>=1.12",
    "pydantic>=2.6",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "ddgs>=9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
recherche = "recherche.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
