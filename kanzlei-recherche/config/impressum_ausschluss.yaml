# Adressen und Abschnitte, die im Impressum stehen, aber NICHT die Kanzlei sind.
# Wird von extract/rules.py genutzt. Liste bei Bedarf ergänzen (Stand: bitte prüfen).

# Zeilen mit diesen Wörtern leiten einen Fremd-Abschnitt ein; Adressen und Telefonnummern in
# den folgenden `abschnitt_zeilen` Zeilen werden ignoriert. Reguläre Ausdrücke, ohne Groß/Klein.
abschnitt_zeilen: 6
abschnitt_woerter:
  - 'kammer\b'                    # Steuerberaterkammer, Wirtschaftsprüferkammer, „zuständige Kammer"
  - 'aufsichtsbeh'
  - 'berufshaftpflicht'
  - 'haftpflichtversicher'
  - 'versicherer'
  - 'vermögensschadenhaftpflicht'
  - 'hosting|hoster|gehostet'
  - 'webdesign|web-design|gestaltung|realisierung|umsetzung|programmierung|konzeption'
  - 'bildnachweis|bildquellen|fotos?:|fotografie'
  - 'datenschutzbeauftragt'
  - 'streitschlichtung|schlichtungsstelle'
  - 'berufsrechtliche regelungen|steuerberatungsgesetz|berufsordnung'
  - 'bundessteuerberaterkammer|datev'

# Bekannte Fremdadressen (Straße wie im Impressum, PLZ). Ausschluss über den normalisierten
# Adressschlüssel, unabhängig von der Schreibweise.
