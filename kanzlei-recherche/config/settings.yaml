# Zentrale Konfiguration. Relative Pfade gelten ab dem Projektordner kanzlei-recherche/.
# Derselbe Code läuft lokal und auf dem Mietserver – nur diese Datei (und .env) anpassen.

standard_bundesland: SH

bundeslaender:
  SH:
    name: Schleswig-Holstein
    orte_datei: config/orte_SH.csv

pfade:
  db: data/recherche.sqlite
  # {bundesland} und {datum} werden ersetzt
  ausgabe: data/export/kanzleien_{bundesland}_{datum}.xlsx
  queries: config/queries.yaml
  blocklist: config/domain_blocklist.txt
  referenz: config/referenz_kammern.yaml
  impressum_ausschluss: config/impressum_ausschluss.yaml
  fixtures_beispiele: tests/fixtures/kanzleiseiten/beispiele
  fixtures_echt: tests/fixtures/kanzleiseiten/echt   # nur lokal (.gitignore)

discovery:
  # Prinzip: zuerst die günstigste Quelle vollständig ausschöpfen (Stufe A),
  # dann nur die Lücken mit der nächsten Quelle füllen (Stufe B, `recherche fill`).
  stufe_a:
    adapter: brave                   # brave | google_cse | serpapi | ddgs
    max_results_per_query: 60        # harte Obergrenze je Query
    # Gründlichkeit je Einwohnerklasse: varianten = erste N Vorlagen aus queries.yaml,
    # seiten = Ergebnisseiten je Query (Brave: 20 Treffer je Seite). "alle" = ohne Begrenzung.
    # Kalibriert am SH-Lauf (suche-auswertung --grenzen 1000,2000,5000,10000,20000; vorläufig, ~3.000 Kandidaten
    # noch nicht gelesen), Kanzleien je 100 Anfragen: 0–999 EW 9,6 · 1.000–1.999 5,2 · 2.000–4.999 10,0 ·
    # 5.000–9.999 28,1 · 10.000–19.999 49,5 · ab 20.000 175 · Stadtteile 14. Orte unter 5.000 EW und Stadtteile
    # deckt das amtliche Verzeichnis PLZ für PLZ ab (stb_verzeichnis, Grundliste).
    einwohner_regel:
      - {unter: 5000, varianten: 0}                # keine Websuche – amtliches Verzeichnis je PLZ
      - {unter: 20000, varianten: 2, seiten: 2}
      - {varianten: alle, seiten: 3}
    ohne_einwohner: {varianten: alle, seiten: 3}   # Einwohnerzahl unbekannt: lieber gründlich
    stadtteil: {varianten: 1, seiten: 1}           # Zusatz-Suchorte großer Städte (stadtteil_vorlagen)
    # Seitenbegrenzung aussetzen, wenn die letzte erlaubte Seite voll war und überwiegend
    # Kanzlei-Domains enthielt (Kleinstadt mit vielen Kanzleien) – dann nächste Seite holen
    weiter_wenn_voll:
      aktiv: true
      anteil_kanzlei_domains: 0.5
    # Kleingemeinden: Treffer, die eine große Stadt außerhalb des Bundeslandes nennen (config/grossstaedte.yaml),
    # nicht aber den Suchort, gar nicht erst als Kandidat anlegen
    fremdorte:
      aktiv: true
      unter_einwohner: 2000
  max_anfragen_je_lauf: 2500         # Budget je Lauf und Adapter (bezahlte Anfragen, ohne Cache-Treffer)
  coverage:
    quote_ziel: 0.9                  # Lücke, wenn gefunden < erwartet * quote_ziel
    top_orte: 15

  quellen:
    # ---- Stufe A: Websuche je Ort mit den Query-Vorlagen aus queries.yaml
    brave:                           # Standard. Key: BRAVE_API_KEY in .env
      aktiv: true
      per_page: 20                   # count, max. 20
      max_per_query: 60              # Paging über offset (Seitenindex 0..9)
      country: DE
      search_lang: de
      pause_s: 1.1                   # Brave: Ratenlimit je Sekunde laut Tarif
      retries: 3
      backoff_s: 5.0
      kosten_je_1000: 5.0
      guthaben: null                 # Restguthaben in $ (Dashboard) – Warnung vor dem Start, wenn die Schätzung darüber liegt
    google_cse:                      # nur mit Alt-Key (API für Neukunden gesperrt, Ende 01.01.2027)
      aktiv: false                   # Keys: GOOGLE_CSE_API_KEY, GOOGLE_CSE_ID
      per_page: 10
      max_per_query: 30
      kosten_je_1000: 5.0
      freikontingent_tag: 100
    serpapi:                         # Platzhalter: Google-Trefferseite über SerpAPI (Pilot-Vergleich)
      aktiv: false                   # Key: SERPAPI_KEY
      kosten_je_1000: 15.0
    ddgs:                            # nur lokale Entwicklung, ohne Key
      aktiv: true
      region: de-de
      backend: duckduckgo
      pause_s: 3.0
      pause_jitter_s: 2.0
      retries: 3
      backoff_s: 20.0

    # ---- Stufe B: Lückenfüller, nur für übergebene Orte (oder --luecken / --alle)
    places:                          # Google Places Text Search (New) über ein Rechteck-Raster (fill --orte)
      aktiv: false                   # stillgelegt: Name/Adresse nur in der kostenpflichtigen Pro-Stufe (Code bleibt)
      text_query: Steuerberater
      included_type: accounting
      zelle_km: 5.0                  # Startzellen; volle Zellen (60 Treffer) werden geviertelt
      min_zelle_km: 0.5
      kosten_je_1000: 35.0           # Text Search Enterprise (Telefon/Website) – mit der aktuellen Preisliste abgleichen
      pause_s: 0.2
    # ---- Verzeichnisse (search/verzeichnisse.py), Aufbau aus den Seiten in tests/fixtures/verzeichnisse.
    # Platzhalter {rubrik} {ort} {ort_klein} {plz} {seite} {start}. Branchenverzeichnisse nur `fill --unvollstaendig`,
    # `--luecken` oder `--orte`, nie --alle; das amtliche Verzeichnis als Grundliste auch --alle.
    # Branchenverzeichnisse: nur Telefon/Adresse/Website zu bekannten Kandidaten ohne Website (nur_ergaenzen).
    gelbeseiten:
      aktiv: true                    # nur Ergänzungsmodus (bekannte Kandidaten ohne Website)
      pause_s: 10.0
      pause_jitter_s: 5.0
      url_vorlage: "https://www.gelbeseiten.de/suche/steuerberater/{ort_klein}"
      max_seiten: 1                  # weitere Einträge nur per AJAX („Mehr anzeigen") – erste 50
      nur_ergaenzen: true
      website_nachsuche: false
    dasoertliche:
      aktiv: true                    # nur Ergänzungsmodus (bekannte Kandidaten ohne Website)
      pause_s: 10.0
      pause_jitter_s: 5.0
      url_vorlage: "https://www.dasoertliche.de/?kw={rubrik}&ci={ort}&form_name=search_nat&recFrom={start}"
      seitengroesse: 25
      nur_ergaenzen: true
      website_nachsuche: false
    elf880:                          # 11880.com
      aktiv: true                    # nur Ergänzungsmodus (bekannte Kandidaten ohne Website)
      pause_s: 10.0
      pause_jitter_s: 5.0
      url_vorlage: "https://www.11880.com/suche/steuerberater/{ort_klein}?page={seite}"
      nur_ergaenzen: true
      website_nachsuche: false
    stb_verzeichnis:                 # amtliches Steuerberaterverzeichnis (BStBK), PLZ für PLZ – Grundliste
      aktiv: true
      nur_luecken: false             # Grundliste: auch `fill --alle` (alle PLZ des Bundeslandes)
      pause_s: 30.0
      pause_jitter_s: 5.0
      je_plz: true
      url_vorlage: "https://steuerberaterverzeichnis.berufs-org.de/?lang=de"
      formular: {nachnameOrFirmenname: "", ortFilter: "", plzFilter: "{plz}"}   # Suche per POST
      max_seiten: 1                  # alle Treffer einer PLZ auf einer Seite („Treffer: 209 von 209")

crawl:
  parallel_domains: 10               # so viele Domains gleichzeitig
  requests_per_second_per_domain: 1.0
  timeout_s: 15
  retries: 2
  backoff_s: 2.0
  respect_robots: true
  user_agent: "kanzlei-recherche/0.1 (Recherche-Tool; Kontakt siehe README)"
  max_seiten_je_domain: 6            # Start, Impressum, Kontakt, Team + Rateversuche
  min_text_zeichen: 300              # darunter gilt eine Seite als leer (JavaScript)
  playwright: true                  # Rückfall für JavaScript-Seiten (setup.sh --mit-playwright)
  playwright_timeout_s: 20
  playwright_warten_s: 2             # nach „domcontentloaded" warten (networkidle läuft oft in den Timeout)
  # Teamseite mit großem HTML, aber Text unter 2 % davon (Namen per JavaScript) → Playwright
  playwright_team_min_html: 20000
  playwright_team_min_anteil: 0.02

extract:
  # Kanzlei-Erkennung: Zeile gilt nur als Kanzlei mit Berufsträger, Kanzlei-Rechtsform,
  # Kanzleiwort im Namen (Steuer…, StB, Kanzlei, Treuhand, Revision, Wirtschaftsprüf…) oder
  # Steuerberaterkammer im Impressum; sonst Status „keine Kanzlei" (eigenes Excel-Blatt).
  # Nach dem Pilot einschalten; bestehende Daten: recherche kanzlei-pruefung
  kanzlei_pruefung: true
  kanzlei_rechtsformen: [PartG mbB, PartG, Einzelkanzlei]
  # Größenklassen der Teamgröße als Obergrenzen: 1 · 2-5 · 6-10 · 11-20 · 21-50 · 51-100 · >100.
  # Zahl, wenn ablesbar; sonst Klasse aus dem Text („über 20" → 21-50); sonst leer – keine Schätzung.
  groessenklassen: [1, 5, 10, 20, 50, 100]

llm:
  provider: ollama
  url: http://localhost:11434
  # Lokal (Standard): neuestes Qwen-3-Modell der 8B-Klasse in der Ollama-Bibliothek.
  #   Qwen 3.5 gibt es dort als 9B (kein 8B mehr); Vorgänger: qwen3:8b
  modell: qwen3.5:9b
  fallback_modell: llama3.1:8b
  # GPU-Server – nach dem Fixture-Vergleich hier umschalten:
  #   modell: qwen3.6:27b        # Standard Server: Qwen 3.6 27B, dicht
  #   modell: gemma4:26b         # Alternative: Gemma 4 26B-A4B (MoE)
  think: false                       # Thinking-Modus immer aus
  temperature: 0.0
  timeout_s: 300
  num_ctx: 8192                    # Kontextfenster (Ollama-Standard ist zu klein und schneidet ab)
  retries: 1                         # erneuter Versuch bei ungültiger Antwort
  # Text aller Seiten zusammen. auto = (num_ctx − 700 − 2000 Token Reserve) × 3,0 Zeichen/Token,
  # bei num_ctx 16384 ≈ 41.000 Zeichen. Vorher wird gezielt bereinigt (extract/prompt.py).
  max_text_chars: auto

openplz:
  url: https://openplzapi.org
  page_size: 50
  pause_s: 0.5

orte:                                # recherche orte --bundesland SH
  gv_isys:
    # Gemeindeverzeichnis (Destatis GV-ISys, „Alle politisch selbständigen Gemeinden"),
    # XLSX oder CSV, Pfad oder URL. Zuordnung über den amtlichen Gemeindeschlüssel (AGS).
    quelle: data/gv_isys/gemeindeverzeichnis.xlsx
    blatt: null                      # Standard: erstes Blatt mit Spalte „Satzart"
    spalten:                         # Teilübereinstimmung, ohne Groß/Klein und Bindestriche
      satzart: satzart
      textkennzeichen: textkennzeichen
      ags: amtlicher gemeindeschlüssel   # falls vorhanden, sonst aus land/rb/kreis/gem
      land: land
      rb: rb
      kreis: kreis
      gem: gem
      name: gemeindename
      einwohner: insgesamt           # „Bevölkerung insgesamt"
      kreisname: null                # nur CSV ohne Kreis-Zeilen
  stadtteile:                        # Zusatz-Suchorte je PLZ-Bezirk (Kiel, Lübeck)
    aktiv: true
    ab_einwohner: 100000
    nur_kreisfrei: true
